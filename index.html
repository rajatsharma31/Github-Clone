<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GitHub Clone</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ========== STEP 1: NAVBAR ========== -->
  <header class="navbar">
    <div class="navbar__left">
      <a href="#" class="logo" aria-label="GitHub home">
        <svg width="32" height="32" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
          <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0016 8c0-4.42-3.58-8-8-8z"/>
        </svg>
      </a>
      <nav class="nav">
        <a href="#">Product</a>
        <a href="#">Solutions</a>
        <a href="#">Resources</a>
        <a href="#">Open Source</a>
        <a href="#">Enterprise</a>
        <a href="#">Pricing</a>
      </nav>
    </div>
    <div class="navbar__right">
      <input type="search" class="search" placeholder="Search or jump to...">
      <a href="#" class="link-signin">Sign in</a>
      <a href="#" class="btn btn--outline">Sign up</a>
    </div>
  </header>

  <!-- ========== STEP 1: HERO ========== -->
  <main>
    <section class="hero">
      <a href="#" class="pill">GitHub Universe '26 Recap</a>
      <h1>Software still starts<br>with you</h1>
      <form class="hero__form">
        <input type="email" placeholder="Enter your email" aria-label="Email address">
        <button type="button" class="btn btn--green">Sign up for GitHub</button>
        <button type="button" class="btn btn--outline">Download GitHub Copilot app</button>
      </form>
    </section>
  </main>

</body>
</html>
