<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GitHub Clone</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- NAVBAR -->
<header class="navbar">
  <div class="navbar__left">
    <a href="#"><img src="images/github-icon.svg" alt="GitHub" width="32" height="32"></a>
    <nav class="nav">
      <a href="#" class="dd">Products</a><a href="#" class="dd">Developers</a>
      <a href="#" class="dd">Businesses</a><a href="#" class="dd">Resources</a><a href="#">Pricing</a>
    </nav>
  </div>
  <div class="navbar__right">
    <i class="fa-solid fa-magnifying-glass" id="search"></i>
    <a href="#" class="link-signin">Sign in</a>
    <a href="#" class="btn btn--dark">Sign up</a>
  </div>
</header>

<main class="wrap">

  <!-- HERO -->
  <section class="hero dots">
    <div class="line l1"></div>
    <div class="line l1"></div>
    <a href="#" class="pill"><span class="pill__icon"></span> GitHub Universe '26 Recap <i class="fa-solid fa-chevron-right"></i></a>
    <h1>Software still starts<br>with you</h1>
    <form class="hero__form">
      <div class="email-box">
        <input type="email" placeholder="Enter your email" aria-label="Email address">
        <button type="button" class="btn btn--green">Sign up for GitHub</button>
      </div>
      <button type="button" class="btn btn--outline">Download GitHub Copilot app</button>
    </form>
    <br><br><br>
    <div class="sticker-wrap">
      <span class="px px1"></span>
      <span class="px px2"></span>
      <span class="px px3"></span>
      <span class="px px4"></span>
      <span class="px px5"></span>

      <img src="images/mascot2.png" class="sticker">
    </div>
  </section>
  <div class="rainbow"></div>


</body>
</html>
